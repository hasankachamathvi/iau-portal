# ================================================
# Application Profile: Development
# ================================================
spring.application.name=iau-portal-dev

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/iau_portal_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging
logging.level.root=DEBUG
logging.level.com.slt.iau_portal=DEBUG
logging.level.org.springframework.web=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false

# Email (use console appender for testing)
spring.mail.host=localhost
spring.mail.port=1025
