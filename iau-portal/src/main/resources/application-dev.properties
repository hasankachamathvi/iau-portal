# ================================================
# Application Profile: Development (uses embedded H2 for local testing)
# ================================================
spring.application.name=iau-portal-dev

# Use embedded H2 in-memory database for faster local development
# ================================================
# Application Profile: Development (uses embedded H2 for local testing)
# ================================================
spring.application.name=iau-portal-dev

# Use embedded H2 file-backed database for local development
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/iau_dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Use H2 dialect in dev so DDL is compatible with in-memory DB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema from SQL script (schema in classpath:db/schema.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
# Also initialize data for development
spring.sql.init.data-locations=classpath:db/data.sql
# data will still be seeded programmatically by DevDataInitializer after startup
spring.jpa.defer-datasource-initialization=true

# Disable devtools automatic restarts for predictable startup ordering
spring.devtools.restart.enabled=false

# Logging
logging.level.root=DEBUG
logging.level.com.slt.iau_portal=DEBUG
logging.level.org.springframework.web=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false

# Email (use console appender for testing)
spring.mail.host=localhost
spring.mail.port=1025

# reCAPTCHA (place your keys here for local testing)
# Register the site at https://www.google.com/recaptcha/admin to obtain keys
recaptcha.site=YOUR_RECAPTCHA_SITE_KEY
recaptcha.secret=YOUR_RECAPTCHA_SECRET_KEY
recaptcha.enabled=false
