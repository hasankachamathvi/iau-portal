# ================================================
# Application Profile: Development (uses embedded H2 for local testing)
# ================================================
spring.application.name=iau-portal-dev

# Use embedded H2 in-memory database for faster local development
spring.datasource.url=jdbc:h2:mem:iau_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Enable H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema and seed data using SQL script
spring.sql.init.mode=never
# data will be seeded programmatically by DevDataInitializer after startup
spring.jpa.defer-datasource-initialization=true

# Disable devtools automatic restarts for predictable startup ordering
spring.devtools.restart.enabled=false

# Logging
logging.level.root=DEBUG
logging.level.com.slt.iau_portal=DEBUG
logging.level.org.springframework.web=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false

# Email (use console appender for testing)
spring.mail.host=localhost
spring.mail.port=1025
