# Application Profile: MySQL (use by setting --spring.profiles.active=mysql)
spring.application.name=iau-portal-mysql

# MySQL datasource (placeholders; set via env vars or edit directly)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iau_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:iau_user}
spring.datasource.password=${DB_PASSWORD:changeme}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable H2 console when using MySQL
spring.h2.console.enabled=false
spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.com.slt.iau_portal=DEBUG
