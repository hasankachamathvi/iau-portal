# ================================================
# Application Profile: Production
# ================================================
spring.application.name=iau-portal-prod

# Database - Production Database Settings
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iau_portal_prod}?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging - Production Logging
logging.level.root=WARN
logging.level.com.slt.iau_portal=INFO
logging.level.org.springframework.web=WARN
logging.file.name=/var/log/iau-portal/iau-portal.log
logging.file.max-size=50MB
logging.file.max-history=90

# Thymeleaf - Cache enabled in production
spring.thymeleaf.cache=true

# Email - Production Email Settings
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Security
spring.security.require-ssl=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Compression
server.compression.enabled=true
server.compression.min-response-size=2048

# Session
server.servlet.session.timeout=30m
