# ================================================
# SLTMobitel IAU Portal - Application Configuration
# ================================================

spring.application.name=iau-portal
app.name=SLTMobitel Internal Affairs Unit
app.version=1.0.0
spring.profiles.default=dev

# ================================================
# SERVER
# ================================================
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ================================================
# DATABASE (Railway / environment-driven defaults)
# ================================================
spring.datasource.url=${MYSQL_URL:${DATABASE_URL:}}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.jpa.open-in-view=false

# ================================================
# THYMELEAF
# ================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================================
# LOGGING (safe for Railway)
# ================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# disable file logging (Railway does not persist files)
logging.file.name=

# ================================================
# FILE UPLOAD (FIXED FOR CLOUD)
# ================================================
upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ================================================
# SECURITY (safe default)
# ================================================
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# ================================================
# EMAIL (optional safe placeholders)
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================================================
# APP SETTINGS
# ================================================
app.jwt.secret=${JWT_SECRET:change-this}
app.jwt.expiration=86400000