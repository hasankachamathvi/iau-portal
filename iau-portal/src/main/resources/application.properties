# ================================================
# SLTMobitel IAU Portal - Application Configuration
# ================================================

# App name
spring.application.name=iau-portal

# ================================================
# Database Connection
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iau_portal
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# JPA / Hibernate
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================
# Thymeleaf
# ================================================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# ================================================
# File Upload Settings
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ================================================
# Server Port
# ================================================
server.port=8080

# Upload directory for evidence files
upload.dir=C:/uploads/iau-portal

# ================================================
# Email Configuration (Optional - for notifications)
# ================================================
# If email is not configured, notifications will be logged instead
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000