# ================================================
# SLTMobitel IAU Portal - Application Configuration
# ================================================

spring.application.name=iau-portal
app.name=SLTMobitel Internal Affairs Unit
app.version=1.0.0

# ================================================
# SERVER
# ================================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ================================================
# DATABASE (RAILWAY MYSQL - FIXED)
# ================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ================================================
# THYMELEAF
# ================================================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================================
# LOGGING (safe for Railway)
# ================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# disable file logging (Railway does not persist files)
logging.file.name=

# ================================================
# FILE UPLOAD (FIXED FOR CLOUD)
# ================================================
upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ================================================
# SECURITY (safe default)
# ================================================
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# ================================================
# EMAIL (optional safe placeholders)
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================================================
# APP SETTINGS
# ================================================
app.jwt.secret=${JWT_SECRET:change-this}
app.jwt.expiration=86400000