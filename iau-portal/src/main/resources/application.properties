# ================================================
# SLTMobitel IAU Portal - Application Configuration
# ================================================

# App name and info
spring.application.name=iau-portal
app.name=SLTMobitel Internal Affairs Unit
app.version=1.0.0

# ================================================
# Server Configuration
# ================================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-binding-errors=always

# ================================================
# Database Connection (MySQL)
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iau_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ================================================
# JPA / Hibernate Configuration
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ================================================
# Thymeleaf Template Engine
# ================================================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================================
# Logging Configuration
# ================================================
logging.level.root=INFO
logging.level.com.slt.iau_portal=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/iau-portal.log
logging.file.max-size=10MB
logging.file.max-history=30

# ================================================
# File Upload Settings
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=C:/uploads/iau-portal

# ================================================
# Security Configuration
# ================================================
spring.security.filter.order=5
spring.security.user.name=admin
spring.security.user.password=admin123

# ================================================
# Email Configuration (Gmail SMTP)
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender details
mail.from=noreply@iau-portal.slt.lk
mail.from-name=SLTMobitel Internal Affairs Unit

# ================================================
# Application-Specific Settings
# ================================================
app.max-file-size=10485760
app.max-files=5
app.jwt.secret=your-secret-key-change-in-production
app.jwt.expiration=86400000