# ================================================
# SLTMobitel IAU Portal - Application Configuration
# ================================================

# App name
spring.application.name=iau-portal

# ================================================
# Database Connection
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iau_portal
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# JPA / Hibernate
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================
# Thymeleaf
# ================================================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# ================================================
# File Upload Settings
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ================================================
# Server Port
# ================================================
server.port=8080

Important — line 12 says spring.datasource.password=

If your MySQL has no password → leave it blank like above
If your MySQL has a password → type it after the =
Example: spring.datasource.password=mypassword123