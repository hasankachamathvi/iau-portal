<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audit Logs — Admin Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-start: #041730;
      --bg-end: #06304a;
      --primary: #19e6b3;
      --primary-dark: #0fae86;
      --accent: #12c39a;
      --gray-bg: rgba(255,255,255,0.05);
      --gray-border: rgba(255,255,255,0.10);
      --text: rgba(230,247,246,0.96);
      --text-light: rgba(230,247,246,0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(90deg,#041730 0%,#06304a 100%);
      color: var(--text);
    }

    .header {
      background: linear-gradient(135deg, #0b1f3b 0%, #114e8a 55%, #11bfa5 100%);
      color: white;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 24px 36px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(230,247,246,0.92);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      transition: all .2s ease;
    }

    .back-link:hover {
      background: rgba(255,255,255,0.10);
      transform: translateY(-1px);
    }

    .page-note {
      color: var(--text-light);
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 14px;
    }

    .toolbar form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
    }

    .toolbar input {
      flex: 1;
      min-width: 240px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(4,23,48,0.55);
      color: var(--text);
    }

    .toolbar input::placeholder {
      color: rgba(230,247,246,0.45);
    }

    .toolbar select {
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(4,23,48,0.55);
      color: var(--text);
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 62%, var(--accent) 100%);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(230,247,246,0.92);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .panel {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.18);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: rgba(255,255,255,0.04);
      color: rgba(230,247,246,0.82);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    td {
      color: var(--text);
    }

    .meta {
      margin-top: 10px;
      color: var(--text-light);
      font-size: 13px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 105, 180, 0.1);
      color: #8ef1b2;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .page-links a,
    .page-links span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      margin-right: 6px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .page-links span.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .empty-state {
      padding: 28px 24px;
      text-align: center;
      color: var(--text-light);
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="header">
  <div class="header-inner">
    <h1>Audit Logs</h1>
    <p>Submission, access, export, and evidence download activity.</p>
  </div>
</div>

<div class="container">
  <div class="top-actions">
    <a href="/admin/dashboard" class="back-link">← Back to Dashboard</a>
    <div class="page-note">Monitor admin actions and evidence access in one place.</div>
  </div>

  <div class="toolbar">
    <form method="get" action="/admin/audit-logs">
      <input type="text" name="query" placeholder="Search by event, CRN, or actor" th:value="${searchQuery}"/>

      <select name="eventType">
        <option value="all" th:selected="${selectedEventType == null || selectedEventType == 'all'}">All events</option>
        <option th:each="et : ${eventTypes}" th:value="${et}" th:text="${et}" th:selected="${et == selectedEventType}">EVENT</option>
      </select>

      <button class="btn" type="submit">Search</button>
      <a class="btn secondary" th:href="@{/admin/audit-logs(eventType=${selectedEventType})}">Clear</a>
    </form>
  </div>

  <div class="meta">
    <span>Showing <strong th:text="${#lists.size(auditLogs)}">0</strong> of <strong th:text="${totalAuditLogs}">0</strong> events</span>
    <span class="badge" th:text="|Total events: ${auditEventCount}|">Total events: 0</span>
  </div>

  <div class="panel" style="margin-top:16px;">
    <table th:if="${!#lists.isEmpty(auditLogs)}">
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
          <th>CRN</th>
          <th>Actor</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="log : ${auditLogs}">
          <td th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy HH:mm:ss')}">18 May 2026 10:00:00</td>
          <td><span class="badge" th:text="${log.eventType}">EVENT</span></td>
          <td th:text="${log.complaintCrn != null ? log.complaintCrn : '-'}">-</td>
          <td th:text="${log.actor != null ? log.actor : '-'}">-</td>
          <td th:text="${log.details != null ? log.details : '-'}">-</td>
        </tr>
      </tbody>
    </table>

    <div th:unless="${!#lists.isEmpty(auditLogs)}" class="empty-state">
      No audit logs found.
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
      <div>Page <span th:text="${currentPage}">1</span> of <span th:text="${totalPages}">1</span></div>
      <div class="page-links">
        <a th:if="${currentPage > 1}" th:href="@{/admin/audit-logs(page=${currentPage - 2}, query=${searchQuery}, eventType=${selectedEventType})}">‹</a>
        <span th:unless="${currentPage > 1}">‹</span>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:if="${i != currentPage}" th:href="@{/admin/audit-logs(page=${i - 1}, query=${searchQuery}, eventType=${selectedEventType})}" th:text="${i}">1</a>
          <span th:if="${i == currentPage}" class="active" th:text="${i}">1</span>
        </th:block>
        <a th:if="${currentPage < totalPages}" th:href="@{/admin/audit-logs(page=${currentPage}, query=${searchQuery}, eventType=${selectedEventType})}">›</a>
        <span th:unless="${currentPage < totalPages}">›</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
