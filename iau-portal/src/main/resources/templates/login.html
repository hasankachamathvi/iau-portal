<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — IAU Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #0d3b6e;
      --primary-dark: #0a2d52;
      --accent: #3b82f6;
      --gray-bg: #f4f6f9;
      --gray-border: #dde3ec;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--primary) 0%, #1a5276 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .login-header p {
      font-size: 14px;
      color: #718096;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1a202c;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gray-border);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 59, 110, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #1a5276 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13, 59, 110, 0.3);
    }

    .error-message {
      background: #fdecea;
      color: #c0392b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid #c0392b;
    }

    .info-box {
      background: var(--gray-bg);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #718096;
      margin-top: 24px;
      line-height: 1.6;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h1>🛡️ Admin Login</h1>
    <p>Internal Affairs Unit Portal</p>
  </div>

  <th:block th:if="${param.error}">
    <div class="error-message">
      ❌ Invalid username or password. Please try again.
    </div>
  </th:block>

  <th:block th:if="${param.logout}">
    <div style="background: #d5f5e3; color: #1a7a4a; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; border: 1px solid #1a7a4a;">
      ✅ Logged out successfully.
    </div>
  </th:block>

  <form method="post" th:action="@{/login}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" placeholder="Enter username" required autofocus/>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Enter password" required/>
    </div>

    <button type="submit" class="login-btn">Sign In</button>
  </form>

  <div class="info-box">
    <strong>Demo Credentials:</strong><br/>
    Username: <code style="background: white; padding: 2px 4px; border-radius: 3px;">admin</code><br/>
    Password: <code style="background: white; padding: 2px 4px; border-radius: 3px;">admin123</code>
  </div>

  <div class="back-link">
    <a href="/">← Back to Complaint Portal</a>
  </div>
</div>

</body>
</html>
