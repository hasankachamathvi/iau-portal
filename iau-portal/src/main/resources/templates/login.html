<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — IAU Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-start: #041730;
      --bg-end: #06304a;
      --primary: #19e6b3;
      --primary-dark: #0fae86;
      --primary-light: #12c39a;
      --accent: #10b981;
      --gray-bg: rgba(255,255,255,0.05);
      --gray-border: rgba(255,255,255,0.10);
      --text: rgba(230,247,246,0.95);
      --text-light: rgba(230,247,246,0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(25,230,179,0.16), transparent 30%), radial-gradient(circle at bottom right, rgba(15,174,134,0.14), transparent 28%);
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.28);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .login-brand-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(25,230,179,0.16) 0%, rgba(15,174,134,0.14) 100%);
      border: 1px solid rgba(25,230,179,0.20);
      color: var(--primary);
      box-shadow: 0 8px 22px rgba(15,174,134,0.14);
      flex-shrink: 0;
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/css/theme.css">
      </head>
      <body>

      <div class="auth-page">
        <div class="auth-left">
          <div class="auth-inner">
            <div class="brand-row">
              <img src="/images/sltlogo.jpg" alt="SLT" class="brand-logo"/>
            </div>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Please enter your details</p>

            <th:block th:if="${param.error}">
              <div class="auth-error">Invalid username or password. Please try again.</div>
            </th:block>

            <th:block th:if="${param.logout}">
              <div class="auth-success">Logged out successfully.</div>
            </th:block>

            <form class="auth-form" method="post" th:action="@{/login}">
              <div class="form-group">
                <label for="username">Email address</label>
                <input type="text" name="username" id="username" placeholder="" required autofocus/>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="" required/>
              </div>

              <div class="form-row">
                <label class="checkbox"><input type="checkbox" name="remember"/> Remember for 30 days</label>
                <a class="forgot" href="#">Forgot password</a>
              </div>

              <button type="submit" class="btn-primary auth-submit">Sign in</button>

              <div class="or-sep"> </div>

              <button type="button" class="btn-google">
                <span style="height:18px;margin-right:8px;display:inline-block;background:#fff;border-radius:2px;padding:2px 4px;font-weight:700;color:#222;">G</span> Sign in with Google
              </button>

              <p class="muted center" style="margin-top:18px;">Don't have an account? <a href="#">Sign up</a></p>
            </form>

          </div>
        </div>

        <div class="auth-right">
          <div class="auth-art">
            <img src="/images/complaint-illustration.svg" alt="Illustration"/>
          </div>
        </div>
      </div>

      </body>
      </html>
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s;
      background: rgba(4,23,48,0.56);
      color: var(--text);
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: rgba(230,247,246,0.45);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(25,230,179,0.16);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 62%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15,174,134,0.32);
    }

    .error-message {
      background: rgba(224,36,36,0.12);
      color: #ffb4b4;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid rgba(224,36,36,0.32);
    }

    .info-box {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-light);
      margin-top: 24px;
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.10);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="login-brand">
      <img src="/images/sltlogo.jpg" alt="SLT Logo" style="width:72px;height:46px;object-fit:contain;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);"/>
      <div class="login-brand-text">
        <span class="brand">Admin Login</span>
        <span class="sub">Internal Affairs Unit Portal</span>
      </div>
    </div>
    <h1>Secure Access</h1>
    <p>Internal Affairs Unit Portal</p>
  </div>

  <th:block th:if="${param.error}">
    <div class="error-message">
      ❌ Invalid username or password. Please try again.
    </div>
  </th:block>

  <th:block th:if="${param.logout}">
    <div style="background: rgba(74,203,50,0.12); color: #8ef1b2; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; border: 1px solid rgba(74,203,50,0.26);">
      ✅ Logged out successfully.
    </div>
  </th:block>

  <form method="post" th:action="@{/login}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" placeholder="Enter username" required autofocus/>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Enter password" required/>
    </div>

    <button type="submit" class="login-btn">Sign In</button>
  </form>

  
  <div class="info-box">
    <strong>Demo Credentials:</strong><br/>
    Username: <code style="background: rgba(255,255,255,0.12); color: var(--text); padding: 2px 4px; border-radius: 3px;">admin</code><br/>
    Password: <code style="background: rgba(255,255,255,0.12); color: var(--text); padding: 2px 4px; border-radius: 3px;">admin123</code>
  </div>
  

  <div class="back-link">
    <a href="/">← Back to Complaint Portal</a>
  </div>
</div>

</body>
</html>
