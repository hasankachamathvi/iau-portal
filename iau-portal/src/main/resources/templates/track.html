<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track Complaint — IAU Portal</title>
  <style>
    body{font-family:Inter,Segoe UI,sans-serif;background:#f6f9fc;color:#122033;padding:24px}
    .box{background:#fff;padding:24px;border-radius:10px;border:1px solid #e6eef6;max-width:900px;margin:20px auto}
    .notice{font-size:16px;color:#334155}
    .muted{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Track Complaint</h1>
    <p class="notice" th:text="${message}">Complaint tracking is temporarily unavailable. Please contact support.</p>
    <div th:if="${crn}">
      <p class="muted">Requested CRN: <strong th:text="${crn}"></strong></p>
    </div>
  </div>
</body>
</html>
