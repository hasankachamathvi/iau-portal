<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track Complaint — IAU Portal</title>
  <style>
    body{font-family:Inter,Segoe UI,sans-serif;background:linear-gradient(90deg,#041730 0%,#06304a 100%);color:#e6f7f6;padding:24px}
    .container{max-width:980px;margin:20px auto}
    .card{background:rgba(255,255,255,0.04);padding:24px;border-radius:10px;border:1px solid rgba(255,255,255,0.06)}
    .muted{color:rgba(230,247,246,0.75);font-size:13px}
    .form-row{display:flex;gap:8px;margin-top:12px}
    input[type=text]{flex:1;padding:10px;border:1px solid rgba(255,255,255,0.06);border-radius:6px;background:transparent;color:#e6f7f6}
    button{background:linear-gradient(135deg,#19e6b3 0%,#0fae86 100%);color:#fff;padding:10px 14px;border:none;border-radius:6px}
    .result{margin-top:18px;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.25)}
    .label{color:rgba(230,247,246,0.8);font-size:13px}
  </style>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Track Complaint</h1>
      <p class="muted" th:text="${message}">Enter your complaint reference number (CRN) to track its status.</p>

      <form method="get" action="/track">
        <div class="form-row">
          <input type="text" name="crn" placeholder="Enter CRN (e.g. IAU-2026-000001)" th:value="${crn}" />
          <button type="submit">Track</button>
        </div>
      </form>

      <div th:if="${crn}" class="muted" style="margin-top:12px">Requested CRN: <strong th:text="${crn}"></strong></div>

      <div th:if="${found}" class="result">
        <p><strong th:text="${complaint.crn}"></strong></p>
        <p><span class="label">Status:</span> <span th:text="${complaint.status}"></span></p>
        <p><span class="label">Category:</span> <span th:text="${complaint.category}"></span></p>
        <p><span class="label">Complaint date:</span> <span th:text="${complaint.complaintDate}"></span></p>
        <p><span class="label">Location:</span> <span th:text="${complaint.location}"></span></p>
        <p><span class="label">Created:</span> <span th:text="${#dates.format(complaint.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        <p><span class="label">Last updated:</span> <span th:text="${#dates.format(complaint.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
      </div>

      <div th:if="${found == false}" style="margin-top:12px;color:#b91c1c" th:text="${message}"></div>
    </div>
  </div>
</body>
</html>
